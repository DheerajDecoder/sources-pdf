<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Resources</title>
<style>
body {
background-color: #0d0f12;
color: #ffffff;
font-family: Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
flex-direction: column;
text-align: center;
}
.loader {
border: 4px solid rgba(255, 255, 255, 0.1);
width: 50px;
height: 50px;
border-radius: 50%;
border-left-color: #ffffff;
animation: spin 1s linear infinite;
margin-bottom: 20px;
}
@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
h2 { font-weight: normal; margin-bottom: 5px; }
p { color: #888; font-size: 14px; }
</style>
<meta http-equiv="refresh" content="2;url=https://docs.google.com/uc?export=download&id=1UcNjhXyUSFJ9DAC543ajQlrOi5L7dki">
</head>
<body>
<div class="loader"></div>
<h2>Opening resources...</h2>
<p>Redirecting you to the video sources PDF.</p>
</body>
</html>
